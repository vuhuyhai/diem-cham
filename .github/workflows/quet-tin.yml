name: Quét tin Service Marketing hằng ngày

# Chạy tự động 07:00 giờ Việt Nam mỗi ngày, và cho phép bấm chạy tay.
on:
  schedule:
    - cron: "0 0 * * *"      # 00:00 UTC = 07:00 giờ Việt Nam
  workflow_dispatch: {}

# Cho workflow quyền ghi để commit dữ liệu mới trở lại repo.
permissions:
  contents: write

jobs:
  quet:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Ho_Chi_Minh
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Chạy bộ thu thập tin
        working-directory: diem-cham-app
        run: node thu-thap.js

      - name: Commit dữ liệu mới nếu có thay đổi
        run: |
          git config user.name "diemcham-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diem-cham-app/du-lieu diem-cham-app/index.html
          if git diff --cached --quiet; then
            echo "Không có tin mới, bỏ qua commit."
          else
            git commit -m "Cập nhật tin Service Marketing ($(date +%F))"
            git push
          fi
